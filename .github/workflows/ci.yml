name: Native validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Report compiler
        run: |
          xcodebuild -version
          swift --version
      - name: Swift tests
        run: swift test
      - name: Hook and installer tests
        run: env -u CODEX_HOME -u CLAUDE_CONFIG_DIR -u CURSOR_CONFIG_DIR python3 -m unittest discover -s Tests/InstallHooksTests -p 'test_*.py'
      - name: Packaging tests
        run: env -u CODEX_HOME -u CLAUDE_CONFIG_DIR -u CURSOR_CONFIG_DIR python3 -m unittest discover -s Tests/HomebrewReleaseTests -p 'test_*.py'
      - name: Release build
        run: swift build -c release
